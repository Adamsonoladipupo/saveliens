spring.application.name=saveliens
jwt.secret=${JWT_SECRET}

server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.datasource.url=${SPRING_DATABASE_URL}
spring.datasource.password=${SPRING_DATABASE_PASSWORD}
spring.datasource.username=${SPRING_DATABASE_USERNAME}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth?prompt=select_account

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.com.saveliens.saveliens=DEBUG

# Refresh token validity: 7 days
auth.refresh-token-expiration-days=${REFRESH_TOKEN_EXPIRATION_DAYS}

# Transactional email
saveliens.email.api-key=${RESEND_API_KEY}
saveliens.email.from=${EMAIL_FROM}
saveliens.app.frontend-url=${FRONTEND_URL}

gemini.api.key=${GEMINI_API_KEY}
gemini.api.model=${GEMINI_MODEL}


# Email provider
saveliens.email.provider=${EMAIL_PROVIDER}

# Brevo
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=Saveliens


